{% extends "base.html" %}

{% block title %}DrawingHall | Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="text-center mb-4">
                <p class="eyebrow mb-2">bem-vindo</p>
                <h1 class="h3 mb-0">Login</h1>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="login" class="form-label">E-mail ou nome de usuário</label>
                    <input type="text" class="form-control" id="login" name="login" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">Entrar na galeria <span aria-hidden="true">→</span></button>
            </form>

            <p class="text-center mt-3 mb-0 small text-muted">
                Ainda não tem conta? <a href="{{ url_for('cadastro') }}" class="text-decoration-none text-dark fw-semibold">Cadastre-se</a>
            </p>
            <p class="text-center mt-3 mb-0 small text-muted">Administrador: use o usuário <strong>admin</strong>.</p>
        </div>
    </div>
</div>
{% endblock %}
